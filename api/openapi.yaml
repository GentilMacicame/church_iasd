components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Limite:
      name: limite
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Depois:
      name: depois
      in: query
      description: Cursor devolvido em `proximo`
      schema:
        type: string
    Ordem:
      name: ordem
      in: query
      description: 'Campo de ordenação; "-" inverte (ex.: -dataHora)'
      schema:
        type: string
    IncluirTerminados:
      name: incluirTerminados
      in: query
      schema:
        type: boolean
        default: false
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: UUID gerado no frontend; o mesmo pedido repetido devolve a mesma resposta durante 24 horas
      schema:
        type: string
        format: uuid
  responses:
    PedidoInvalido:
      description: Pedido mal formado ou campo obrigatório em falta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoAutenticado:
      description: Sem token ou token expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    SemPermissao:
      description: SQLSTATE 42501
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Não existe ou não é visível para o utilizador
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Duplicado:
      description: SQLSTATE 23505
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    RegraNegocio:
      description: Regra do Manual ou da tesouraria (P0001, 23514, 23503)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    DemasiadosPedidos:
      description: Limite de pedidos atingido; o header Retry-After diz quantos segundos esperar
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Actividade:
      type: object
      description: Actividades e eventos dos departamentos
      x-tabela: actividades.actividade
      x-prefixo: act
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        departamentoIgrejaId:
          type: integer
          format: int32
          description: → organizacao.igreja_departamento
        responsavelMembroId:
          type: integer
          format: int32
          description: → secretaria.membro
        nome:
          type: string
          maxLength: 150
        descricao:
          type: string
        local:
          type: string
          maxLength: 255
        dataInicio:
          type: string
          format: date-time
        dataFim:
          type: string
          format: date-time
        dataHoraLembrete:
          type: string
          format: date-time
        valorPrevisto:
          type: string
          pattern: ^-?\d{1,14}(\.\d{1,2})?$
          example: '650.00'
        estado:
          $ref: '#/components/schemas/EnumEstadoActividade'
        criadoEm:
          type: string
