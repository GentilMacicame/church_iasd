openapi: 3.0.3
info:
  title: Sistema de Gestão da Igreja Adventista · API
  version: 1.0.0
  description: 'Contrato gerado a partir do esquema da base de dados (database/gerador/defs.py). Campos = colunas sem o prefixo, em camelCase.
    Nada se apaga: use /terminar. As regras e as permissões são aplicadas pela base de dados; `x-permissao` diz qual é exigida, `x-funcao-bd`
    a função usada, `x-vista` a vista lida.'
servers:
- url: http://localhost:9080
  description: API local (./mvnw liberty:dev)
security:
- bearer: []
tags:
- name: Autenticação
- name: 'Núcleo: acesso e auditoria'
  description: Utilizadores, perfis, permissões e o histórico de todas as alterações.
- name: Organização
  description: Estrutura da denominação (Associação/Missão, distritos, igrejas e grupos), departamentos e cargos.
- name: Secretaria
  description: Membros, famílias, reuniões e votos, movimentos do livro de membros, transferências, disciplina e eleições.
- name: Actividades e escalas
  description: Programas dos departamentos, material necessário e escalas de serviço.
- name: Escola Sabatina
  description: Trimestres, sábados, classes (unidades de acção) por divisão, relatórios, chamada, visitantes e pontuação.
- name: Tesouraria
  description: Contas, fundos (da Associação e locais), movimentos divididos por fundo, despesas, contagens, recibos, remessas, orçamento, fecho
    mensal e saldos pré-calculados.
- name: Pagamentos electrónicos
  description: Integração com M-Pesa e bancos (parte da tesouraria).
- name: Comunicação
  description: Fila de SMS, WhatsApp e e-mail (parte do núcleo).
paths:
  /v1/actividades/actividades:
    get:
      summary: 'Actividades: listar'
      tags:
      - Actividades e escalas
      x-permissao: actividades.actividade.ler
      operationId: listarActividade
      description: Actividades e eventos dos departamentos
      parameters:
      - $ref: '#/components/parameters/Limite'
      - $ref: '#/components/parameters/Depois'
      - $ref: '#/components/parameters/Ordem'
      - $ref: '#/components/parameters/IncluirTerminados'
      - name: departamentoIgrejaId
        in: query
        schema:
          type: integer
      - name: responsavelMembroId
        in: query
        schema:
          type: integer
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EnumEstadoActividade'
      - name: desde
        in: query
        schema:
          type: string
          format: date
      - name: ate
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - proximo
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/Actividade'
                  proximo:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Duplicado'
        '422':
          $ref: '#/components/responses/RegraNegocio'
    post:
      summary: 'Actividades: criar'
      tags:
      - Actividades e escalas
      x-permissao: actividades.actividade.criar
      operationId: criarActividade
      description: Actividades e eventos dos departamentos
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Actividade'
              required:
              - departamentoIgrejaId
              - nome
              - dataInicio
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actividade'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Duplicado'
        '422':
          $ref: '#/components/responses/RegraNegocio'
  /v1/actividades/actividades/{id}:
    get:
      summary: 'Actividades: ler um'
      tags:
      - Actividades e escalas
      x-permissao: actividades.actividade.ler
      operationId: lerActividade
      parameters:
      - $ref: '#/components/parameters/Id'
