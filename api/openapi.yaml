      summary: 'Mpesa: listar'
      tags:
      - Pagamentos electrónicos
      x-permissao: tesouraria.pagamento_mpesa.ler
      operationId: listarPagamentoMpesa
      description: Pedido e resposta da API M-Pesa
      parameters:
      - $ref: '#/components/parameters/Limite'
      - $ref: '#/components/parameters/Depois'
      - $ref: '#/components/parameters/Ordem'
      - $ref: '#/components/parameters/IncluirTerminados'
      - name: transacaoId
        in: query
        schema:
          type: integer
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EnumEstadoRegisto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - dados
                - proximo
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/PagamentoMpesa'
                  proximo:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Duplicado'
        '422':
          $ref: '#/components/responses/RegraNegocio'
    post:
      summary: Iniciar um pagamento M-Pesa (cria a transacção pendente e chama a Vodacom)
      tags:
      - Pagamentos electrónicos
      x-permissao: tesouraria.pagamento_mpesa.criar
      operationId: VTesourariaMpesa
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contaId
              - msisdn
              - linhas
              properties:
                contaId:
                  type: integer
                msisdn:
                  type: string
                  pattern: ^2588[2-7]\d{7}$
                membroId:
                  type: integer
                linhas:
                  type: array
                  items:
                    type: object
                    required:
                    - fundoId
                    - categoriaId
                    - valor
                    properties:
                      fundoId:
                        type: integer
                      categoriaId:
                        type: integer
                      valor:
                        type: string
                        pattern: ^-?\d{1,14}(\.\d{1,2})?$
                        example: '650.00'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - transacaoId
                - estado
                properties:
                  transacaoId:
                    type: integer
                  estado:
                    $ref: '#/components/schemas/EnumEstadoTransacao'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Duplicado'
        '422':
          $ref: '#/components/responses/RegraNegocio'
