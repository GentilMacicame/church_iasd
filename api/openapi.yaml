  /v1/auth/login:
    post:
      summary: Entrar
      tags:
      - Autenticação
      operationId: VAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              - senha
              properties:
                login:
                  type: string
                senha:
                  type: string
      x-funcao-bd: nucleo.fn_credenciais + nucleo.fn_abrir_sessao
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - tokenAcesso
                - expiraEm
                properties:
                  tokenAcesso:
                    type: string
                  expiraEm:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Duplicado'
        '422':
          $ref: '#/components/responses/RegraNegocio'
      security: []
  /v1/auth/recuperar:
    post:
      summary: Pedir código de recuperação (resposta igual exista ou não o login)
      tags:
      - Autenticação
      operationId: VAuthRecuperar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              properties:
                login:
                  type: string
      x-funcao-bd: nucleo.fn_pedir_recuperacao
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
