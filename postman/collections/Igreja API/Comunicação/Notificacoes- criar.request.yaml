$kind: http-request
name: 'Notificacoes: criar'
description: Fila de SMS, WhatsApp e e-mail a enviar
url: '{{baseUrl}}/v1/nucleo/notificacoes'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
body:
  type: json
  content: |-
    {
      "igrejaId": {{igrejaId}},
      "membroId": null,
      "canal": "SMS",
      "destino": "texto",
      "assunto": "texto",
      "mensagem": "texto",
      "agendadaPara": "2026-11-14T09:00:00+02:00",
      "enviadaEm": "2026-11-14T09:00:00+02:00",
      "tentativas": 1,
      "erro": "texto",
      "origemTabela": "texto",
      "origemId": null,
      "chave": "texto"
    }
settings: {}
examples: ./.resources/Notificacoes- criar.resources/examples
order: 2000
