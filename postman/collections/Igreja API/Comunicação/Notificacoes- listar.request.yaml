$kind: http-request
name: 'Notificacoes: listar'
description: Fila de SMS, WhatsApp e e-mail a enviar
url: '{{baseUrl}}/v1/nucleo/notificacoes?igrejaId={{igrejaId}}&limite=50'
method: GET
headers:
- key: Accept
  value: application/json
queryParams:
- key: igrejaId
  value: '{{igrejaId}}'
  disabled: false
- key: limite
  value: '50'
  disabled: false
- key: depois
  value: ''
  disabled: true
  description: Cursor devolvido em `proximo`
- key: ordem
  value: ''
  disabled: true
  description: 'Campo de ordenação; "-" inverte (ex.: -dataHora)'
- key: incluirTerminados
  value: 'true'
  disabled: true
- key: membroId
  value: ''
  disabled: true
- key: canal
  value: SMS
  disabled: true
- key: estado
  value: ENVIADA
  disabled: true
settings: {}
examples: ./.resources/Notificacoes- listar.resources/examples
order: 1000
