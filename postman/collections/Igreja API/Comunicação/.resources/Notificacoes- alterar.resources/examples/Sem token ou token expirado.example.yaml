$kind: http-example
request:
  url: "{{baseUrl}}/v1/nucleo/notificacoes/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "igrejaId": 936,
        "membroId": 6545,
        "canal": "<string>",
        "destino": "string",
        "assunto": "string",
        "mensagem": "string",
        "agendadaPara": "1998-12-27T11:52:32.098Z",
        "enviadaEm": "2001-09-25T14:25:09.778Z",
        "tentativas": 4754,
        "erro": "string",
        "origemTabela": "string",
        "origemId": 3642,
        "chave": "string",
        "estado": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 3000
