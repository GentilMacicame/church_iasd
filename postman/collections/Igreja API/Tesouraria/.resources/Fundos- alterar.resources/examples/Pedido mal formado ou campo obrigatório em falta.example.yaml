$kind: http-example
request:
  url: "{{baseUrl}}/v1/tesouraria/fundos/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "igrejaId": 6821,
        "codigo": "string",
        "nome": "string",
        "tipo": "<string>",
        "restrito": false,
        "percentagemRemessa": "550.6",
        "destinoEntidadeId": 3408,
        "estado": "<string>"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 2000
