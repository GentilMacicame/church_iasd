        "categoriaId": 7906,
        "fundoId": 7113,
        "descricao": "string",
        "fornecedor": "string",
        "valorSolicitado": "650.00",
        "valorAprovado": "650.00",
        "solicitadoPorUsuarioId": 9576,
        "votoId": 1079,
        "motivoRejeicao": "string",
        "estado": "<string>"
      }
