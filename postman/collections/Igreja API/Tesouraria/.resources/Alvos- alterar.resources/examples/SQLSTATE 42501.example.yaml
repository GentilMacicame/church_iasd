$kind: http-example
request:
  url: "{{baseUrl}}/v1/tesouraria/alvos/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "igrejaId": 3148,
        "fundoId": 2240,
        "descricao": "string",
        "valorAlvo": "650.00",
        "dataInicio": "2018-02-14",
        "dataFim": "1948-04-17",
        "estado": "<string>"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 4000
