$kind: http-example
request:
  url: "{{baseUrl}}/v1/tesouraria/linhas-transacao/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "transacaoId": 1025,
        "fundoId": 3666,
        "categoriaId": 4008,
        "departamentoIgrejaId": 6952,
        "actividadeId": 3852,
        "valor": "650.00",
        "descricao": "string",
        "estado": "<string>"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 6000
