$kind: http-example
request:
  url: "{{baseUrl}}/v1/tesouraria/recalcular-saldos"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "igrejaId": 2844
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "igrejaId": 5354,
        "contas": 2736,
        "fundos": 2428
      }
order: 1000
