$kind: http-example
request:
  url: "{{baseUrl}}/v1/tesouraria/contagens/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "igrejaId": 1987,
        "contaId": 6462,
        "data": "1999-01-30",
        "ocasiao": "string",
        "contador1MembroId": 5432,
        "contador2MembroId": 581,
        "totalContado": "650.00",
        "conferidoPorUsuarioId": 6522,
        "estado": "<string>"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 5000
