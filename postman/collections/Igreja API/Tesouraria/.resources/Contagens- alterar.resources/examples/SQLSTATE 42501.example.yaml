$kind: http-example
request:
  url: "{{baseUrl}}/v1/tesouraria/contagens/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "igrejaId": 4911,
        "contaId": 1418,
        "data": "1979-10-27",
        "ocasiao": "string",
        "contador1MembroId": 4640,
        "contador2MembroId": 2790,
        "totalContado": "650.00",
        "conferidoPorUsuarioId": 2258,
        "estado": "<string>"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 4000
