$kind: http-example
request:
  url: "{{baseUrl}}/v1/tesouraria/extractos/importar"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "contaId": 4336,
        "csv": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "importadas": 3966,
        "repetidas": 1722
      }
order: 1000
