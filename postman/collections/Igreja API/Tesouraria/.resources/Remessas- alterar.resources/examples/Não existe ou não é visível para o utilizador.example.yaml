$kind: http-example
request:
  url: "{{baseUrl}}/v1/tesouraria/remessas/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "igrejaId": 1840,
        "entidadeId": 4252,
        "ano": 2253,
        "mes": 1817,
        "transacaoId": 334,
        "enviadaEm": "1979-06-25",
        "estado": "<string>"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 5000
