$kind: http-example
request:
  url: "{{baseUrl}}/v1/tesouraria/transacoes/:id/recibo"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Idempotency-Key
      value: c966098d-b0d1-9792-7308-91c79fe8dd5f
      disabled: false
      description: UUID gerado no frontend; o mesmo pedido repetido devolve a mesma resposta durante 24 horas
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 4131,
        "transacaoId": 4669,
        "igrejaId": 7821,
        "ano": 9919,
        "numero": 6606,
        "estado": "<string>",
        "criadoEm": "2009-08-14T11:55:53.695Z",
        "modificadoEm": "1972-03-24T22:57:31.072Z",
        "endDate": "1999-05-22T21:05:49.590Z",
        "criadoPor": 7453,
        "modificadoPor": 521
      }
order: 1000
