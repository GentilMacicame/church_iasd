$kind: http-example
request:
  url: "{{baseUrl}}/v1/tesouraria/transacoes/:id/recibo"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Idempotency-Key
      value: be66c6e9-db4c-f0c8-d52e-f60e75819a18
      disabled: false
      description: UUID gerado no frontend; o mesmo pedido repetido devolve a mesma resposta durante 24 horas
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 5000
