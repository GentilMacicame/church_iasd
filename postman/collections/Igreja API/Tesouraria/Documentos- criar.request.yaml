$kind: http-request
name: 'Documentos: criar'
description: Comprovativos (facturas, talões, prints M-Pesa)
url: '{{baseUrl}}/v1/tesouraria/documentos'
method: POST
headers:
- key: Idempotency-Key
  value: '{{$guid}}'
  disabled: false
  description: UUID gerado no frontend; o mesmo pedido repetido devolve a mesma resposta durante 24 horas
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
body:
  type: json
  content: |-
    {
      "transacaoId": null,
      "despesaId": null,
      "tipo": "FACTURA",
      "nomeFicheiro": "texto",
      "url": "texto"
    }
settings: {}
examples: ./.resources/Documentos- criar.resources/examples
order: 42000
