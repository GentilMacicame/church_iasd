$kind: http-request
name: 'Categorias: criar'
description: 'Plano de contas: categorias de receita e despesa'
url: '{{baseUrl}}/v1/tesouraria/categorias'
method: POST
headers:
- key: Idempotency-Key
  value: '{{$guid}}'
  disabled: false
  description: UUID gerado no frontend; o mesmo pedido repetido devolve a mesma resposta durante 24 horas
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
body:
  type: json
  content: |-
    {
      "paiCategoriaId": null,
      "codigo": "texto",
      "nome": "Ana",
      "tipo": "RECEITA",
      "eRemessa": true
    }
settings: {}
examples: ./.resources/Categorias- criar.resources/examples
order: 14000
