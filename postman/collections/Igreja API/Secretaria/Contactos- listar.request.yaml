- key: membroId
  value: ''
  disabled: true
- key: igrejaId
  value: '{{igrejaId}}'
  disabled: false
- key: tipo
  value: WHATSAPP
  disabled: true
- key: estado
  value: ''
  disabled: true
settings: {}
examples: ./.resources/Contactos- listar.resources/examples
