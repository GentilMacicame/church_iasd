method: GET
headers:
- key: Accept
  value: application/json
queryParams:
- key: limite
  value: '50'
  disabled: false
- key: depois
  value: ''
  disabled: true
  description: Cursor devolvido em `proximo`
- key: ordem
  value: ''
  disabled: true
  description: 'Campo de ordenação; "-" inverte (ex.: -dataHora)'
- key: incluirTerminados
  value: 'true'
