$kind: http-example
request:
  url: "{{baseUrl}}/v1/secretaria/reunioes/:id/votos"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "reuniaoId": 529,
        "numero": "string",
        "tipo": "DISCIPLINA",
        "assunto": "string",
        "texto": "string",
        "leitura": 1427,
        "aFavor": 7655,
        "contra": 474,
        "abstencoes": 7665,
        "estado": "APROVADO"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 3000
