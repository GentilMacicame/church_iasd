$kind: http-example
request:
  url: "{{baseUrl}}/v1/secretaria/votos/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "reuniaoId": 5279,
        "numero": "string",
        "tipo": "<string>",
        "assunto": "string",
        "texto": "string",
        "leitura": 7210,
        "aFavor": 8992,
        "contra": 9541,
        "abstencoes": 2481,
        "estado": "<string>"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 5000
