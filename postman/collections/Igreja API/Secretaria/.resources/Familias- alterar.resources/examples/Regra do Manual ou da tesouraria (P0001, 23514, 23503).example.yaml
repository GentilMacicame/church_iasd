$kind: http-example
request:
  url: "{{baseUrl}}/v1/secretaria/familias/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "igrejaId": 8887,
        "nome": "string",
        "morada": "string",
        "estado": "<string>"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 7000
