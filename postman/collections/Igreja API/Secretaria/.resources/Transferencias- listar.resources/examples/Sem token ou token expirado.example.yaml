$kind: http-example
request:
  url: "{{baseUrl}}/v1/secretaria/transferencias?limite=50&depois=string&ordem=string&incluirTerminados=false&membroId=4192&origemIgrejaId=4192&destinoIgrejaId=4192&origemVotoId=4192&destinoVotoId=4192&estado=<string>"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  queryParams:
    limite: "50"
    depois: string
    ordem: string
    incluirTerminados: "false"
    membroId: "4192"
    origemIgrejaId: "4192"
    destinoIgrejaId: "4192"
    origemVotoId: "4192"
    destinoVotoId: "4192"
    estado: <string>
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 3000
