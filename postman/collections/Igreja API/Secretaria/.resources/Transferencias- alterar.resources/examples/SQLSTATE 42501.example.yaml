$kind: http-example
request:
  url: "{{baseUrl}}/v1/secretaria/transferencias/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "membroId": 1949,
        "origemIgrejaId": 9675,
        "destinoIgrejaId": 1865,
        "destinoExterno": "string",
        "dataPedido": "2005-07-16",
        "origemVotoId": 176,
        "cartaEmitidaEm": "2019-11-22",
        "destinoVotoId": 7304,
        "aceiteEm": "2003-05-24",
        "observacoes": "string",
        "estado": "<string>"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 4000
