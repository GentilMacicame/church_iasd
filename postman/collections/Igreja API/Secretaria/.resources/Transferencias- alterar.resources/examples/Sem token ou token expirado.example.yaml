$kind: http-example
request:
  url: "{{baseUrl}}/v1/secretaria/transferencias/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "membroId": 1747,
        "origemIgrejaId": 8792,
        "destinoIgrejaId": 8691,
        "destinoExterno": "string",
        "dataPedido": "1968-03-01",
        "origemVotoId": 6686,
        "cartaEmitidaEm": "2003-01-01",
        "destinoVotoId": 1645,
        "aceiteEm": "2011-09-05",
        "observacoes": "string",
        "estado": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 3000
