$kind: http-example
request:
  url: "{{baseUrl}}/v1/secretaria/oficiais/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "membroId": 8198,
        "cargoId": 6470,
        "igrejaId": 6050,
        "votoId": 321,
        "dataInicio": "1984-04-22",
        "dataFim": "1949-10-30",
        "estado": "<string>"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 6000
