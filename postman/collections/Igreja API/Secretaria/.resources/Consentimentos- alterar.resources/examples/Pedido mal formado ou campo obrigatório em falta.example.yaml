$kind: http-example
request:
  url: "{{baseUrl}}/v1/secretaria/consentimentos/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "membroId": 2174,
        "tipo": "<string>",
        "concedido": false,
        "data": "1949-07-01",
        "concedidoPorMembroId": 4301,
        "observacoes": "string",
        "estado": "<string>"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 2000
