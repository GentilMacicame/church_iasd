$kind: http-example
request:
  url: "{{baseUrl}}/v1/secretaria/baptismos/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "membroId": 1826,
        "data": "1992-02-22",
        "local": "string",
        "oficiante": "string",
        "rebaptismo": true,
        "classeTrimestreId": 3144,
        "localIgrejaId": 825,
        "oficianteUsuarioId": 5810,
        "estado": "<string>"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 4000
