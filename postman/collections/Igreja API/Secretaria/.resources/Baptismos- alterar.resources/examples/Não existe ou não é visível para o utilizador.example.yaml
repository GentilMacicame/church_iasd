$kind: http-example
request:
  url: "{{baseUrl}}/v1/secretaria/baptismos/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "membroId": 5688,
        "data": "1964-05-04",
        "local": "string",
        "oficiante": "string",
        "rebaptismo": false,
        "classeTrimestreId": 1870,
        "estado": "<string>"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 5000
