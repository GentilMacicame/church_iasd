$kind: http-example
request:
  url: "{{baseUrl}}/v1/secretaria/disciplinas/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "membroId": 5036,
        "votoId": 4200,
        "dataInicio": "2016-06-14",
        "dataFim": "2014-10-26",
        "encarregadoNotificado": false,
        "motivo": "string",
        "estado": "<string>"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 4000
