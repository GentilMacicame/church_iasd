$kind: http-example
request:
  url: "{{baseUrl}}/v1/secretaria/disciplinas/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "membroId": 3715,
        "votoId": 7193,
        "dataInicio": "2015-04-24",
        "dataFim": "1992-11-23",
        "encarregadoNotificado": false,
        "motivo": "string",
        "estado": "<string>"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 5000
