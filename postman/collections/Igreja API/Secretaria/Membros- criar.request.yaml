url: '{{baseUrl}}/v1/secretaria/membros'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
body:
  type: json
  content: |-
    {
      "igrejaId": {{igrejaId}},
      "nome": "texto",
      "apelido": "texto"
    }
settings: {}
examples: ./.resources/Membros- criar.resources/examples
order: 36000
