    {
      "membroId": 1,
      "igrejaId": {{igrejaId}},
      "tipo": "BAPTISMO",
      "data": "2026-11-14"
    }
settings: {}
examples: ./.resources/Movimentos membro- criar.resources/examples
order: 45000
