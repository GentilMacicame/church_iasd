$kind: http-example
request:
  url: "{{baseUrl}}/v1/nucleo/usuarios"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "membroId": 111,
        "nome": "string",
        "email": "string",
        "telefone": "string",
        "superAdmin": false,
        "estado": "<string>"
      }
