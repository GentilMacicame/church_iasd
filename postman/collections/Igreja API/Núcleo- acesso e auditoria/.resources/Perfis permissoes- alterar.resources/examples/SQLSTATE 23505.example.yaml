  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 6000
