$kind: http-example
request:
  url: "{{baseUrl}}/v1/nucleo/perfis-permissoes/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "perfilId": 8547,
        "permissaoId": 8597,
        "estado": "<string>"
      }
