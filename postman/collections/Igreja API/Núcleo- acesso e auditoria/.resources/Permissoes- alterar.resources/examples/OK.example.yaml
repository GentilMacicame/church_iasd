$kind: http-example
request:
  url: "{{baseUrl}}/v1/nucleo/permissoes/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "codigo": "string",
        "descricao": "string",
        "estado": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 4448,
        "codigo": "string",
        "descricao": "string",
        "estado": "<string>",
        "criadoEm": "2003-05-13T18:08:24.233Z",
        "modificadoEm": "1967-02-22T13:17:51.092Z",
        "endDate": "1995-06-11T00:21:29.403Z",
        "criadoPor": 8791,
        "modificadoPor": 4748
      }
order: 1000
