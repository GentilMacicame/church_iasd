$kind: http-example
request:
  url: "{{baseUrl}}/v1/organizacao/igrejas/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "entidadeId": 5137,
        "distritoId": 1176,
        "tipo": "<string>",
        "maeIgrejaId": 9212,
        "nome": "string",
        "codigoAcms": "string",
        "dataOrganizacao": "2008-07-06",
        "endereco": "string",
        "latitude": "-7689880.09",
        "longitude": "96056.08",
        "estado": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 3000
