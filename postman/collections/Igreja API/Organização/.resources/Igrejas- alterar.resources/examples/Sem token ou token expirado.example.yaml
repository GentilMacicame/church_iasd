$kind: http-example
request:
  url: "{{baseUrl}}/v1/organizacao/igrejas/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "entidadeId": 8792,
        "distritoId": 9145,
        "tipo": "<string>",
        "maeIgrejaId": 6177,
        "nome": "string",
        "codigoAcms": "string",
        "dataOrganizacao": "1992-05-07",
        "endereco": "string",
        "latitude": "50743",
        "longitude": "434305887.5020",
        "estado": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 3000
