$kind: http-example
request:
  url: "{{baseUrl}}/v1/auth/redefinir"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "login": "string",
        "codigo": "422979",
        "senha": "stringstring"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 3000
