$kind: http-example
request:
  url: "{{baseUrl}}/v1/auth/redefinir"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "login": "string",
        "codigo": "877342",
        "senha": "stringstring"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
