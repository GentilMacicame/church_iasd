$kind: http-example
name: Limite de pedidos atingido; o header Retry-After diz quantos segundos esperar
request:
  url: "{{baseUrl}}/v1/auth/recuperar"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "login": "string"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Retry-After: "4192"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 8000
