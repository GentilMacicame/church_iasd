$kind: http-example
request:
  url: "{{baseUrl}}/v1/auth/renovar"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "tokenAcesso": "string",
        "expiraEm": "2012-12-04T21:18:17.478Z"
      }
order: 1000
