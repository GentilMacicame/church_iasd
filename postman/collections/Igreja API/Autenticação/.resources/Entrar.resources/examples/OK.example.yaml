$kind: http-example
request:
  url: "{{baseUrl}}/v1/auth/login"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "login": "string",
        "senha": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "tokenAcesso": "string",
        "expiraEm": "1968-09-01T13:00:29.196Z"
      }
order: 1000
