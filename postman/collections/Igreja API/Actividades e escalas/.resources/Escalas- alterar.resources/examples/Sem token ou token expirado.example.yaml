$kind: http-example
request:
  url: "{{baseUrl}}/v1/actividades/escalas/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "igrejaId": 8364,
        "data": "2025-07-16",
        "funcao": "<string>",
        "membroId": 9497,
        "actividadeId": 9113,
        "substitutoMembroId": 7355,
        "observacoes": "string",
        "escalaDiaId": 8958,
        "estado": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 3000
