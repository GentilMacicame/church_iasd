$kind: http-example
request:
  url: "{{baseUrl}}/v1/actividades/escalas/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "igrejaId": 68,
        "data": "2025-01-20",
        "funcao": "<string>",
        "membroId": 3217,
        "actividadeId": 5188,
        "substitutoMembroId": 4088,
        "observacoes": "string",
        "escalaDiaId": 5780,
        "estado": "<string>"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 4000
