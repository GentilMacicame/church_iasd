$kind: http-example
request:
  url: "{{baseUrl}}/v1/actividades/actividades/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "departamentoIgrejaId": 1118,
        "responsavelMembroId": 8071,
        "nome": "string",
        "descricao": "string",
        "local": "string",
        "dataInicio": "2017-10-26T06:34:15.211Z",
        "dataFim": "1983-01-01T10:53:03.674Z",
        "dataHoraLembrete": "1971-11-13T05:20:27.524Z",
        "valorPrevisto": "650.00",
        "estado": "<string>"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 2000
