$kind: http-example
request:
  url: "{{baseUrl}}/v1/actividades/actividades/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "departamentoIgrejaId": 8307,
        "responsavelMembroId": 9211,
        "nome": "string",
        "descricao": "string",
        "local": "string",
        "dataInicio": "1956-05-14T06:52:01.109Z",
        "dataFim": "1965-08-23T02:01:52.334Z",
        "dataHoraLembrete": "1990-01-15T17:06:22.243Z",
        "valorPrevisto": "650.00",
        "estado": "<string>"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 2000
