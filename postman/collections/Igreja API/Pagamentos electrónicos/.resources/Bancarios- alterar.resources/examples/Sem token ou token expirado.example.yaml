$kind: http-example
request:
  url: "{{baseUrl}}/v1/tesouraria/bancarios/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "transacaoId": 4609,
        "banco": "string",
        "nib": "string",
        "titular": "string",
        "referenciaBancaria": "string",
        "estado": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 3000
