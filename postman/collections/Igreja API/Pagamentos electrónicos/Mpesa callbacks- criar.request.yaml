$kind: http-request
name: 'Mpesa callbacks: criar'
description: Tudo o que a API M-Pesa envia, em bruto (callbacks repetidos são ignorados)
url: '{{baseUrl}}/v1/tesouraria/mpesa-callbacks'
method: POST
headers:
- key: Idempotency-Key
  value: '{{$guid}}'
  disabled: false
  description: UUID gerado no frontend; o mesmo pedido repetido devolve a mesma resposta durante 24 horas
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
body:
  type: json
  content: |-
    {
      "pagamentoMpesaId": null,
      "tipo": "texto",
      "chaveIdempotencia": "texto",
      "payload": {},
      "processado": true,
      "erro": "texto",
      "recebidoEm": "2026-11-14T09:00:00+02:00"
    }
settings: {}
examples: ./.resources/Mpesa callbacks- criar.resources/examples
order: 10000
