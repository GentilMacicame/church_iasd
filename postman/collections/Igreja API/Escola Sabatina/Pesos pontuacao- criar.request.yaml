$kind: http-request
name: 'Pesos pontuacao: criar'
description: Pesos da pontuação (sem trimestre = pesos por defeito)
url: '{{baseUrl}}/v1/escola-sabatina/pesos-pontuacao'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: Accept
  value: application/json
body:
  type: json
  content: |-
    {
      "trimestreId": null,
      "pesoPresenca": "texto",
      "pesoEstudo": "texto",
      "pesoOfertas": "texto",
      "pesoVisitantes": "texto",
      "limiteOfertas": "texto"
    }
settings: {}
examples: ./.resources/Pesos pontuacao- criar.resources/examples
order: 24000
