$kind: http-example
request:
  url: "{{baseUrl}}/v1/escola-sabatina/visitantes?limite=50&depois=string&ordem=string&incluirTerminados=false&relatorioId=4192&convidadoPorMembroId=4192&tornouSeMembroId=4192&estado=<string>"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  queryParams:
    limite: "50"
    depois: string
    ordem: string
    incluirTerminados: "false"
    relatorioId: "4192"
    convidadoPorMembroId: "4192"
    tornouSeMembroId: "4192"
    estado: <string>
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 4000
