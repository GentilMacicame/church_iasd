$kind: http-example
request:
  url: "{{baseUrl}}/v1/escola-sabatina/pesos-pontuacao"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "trimestreId": 5316,
        "pesoPresenca": "6235140464",
        "pesoEstudo": "-67493163704",
        "pesoOfertas": "-62.07613987",
        "pesoVisitantes": "081418.8559817400",
        "limiteOfertas": "26846297",
        "estado": "<string>"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 4000
