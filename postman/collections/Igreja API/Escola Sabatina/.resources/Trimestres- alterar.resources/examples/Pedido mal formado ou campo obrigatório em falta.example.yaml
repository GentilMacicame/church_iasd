$kind: http-example
request:
  url: "{{baseUrl}}/v1/escola-sabatina/trimestres/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "ano": 3446,
        "numero": 7947,
        "temaLicao": "string",
        "dataInicio": "1953-04-16",
        "dataFim": "2012-01-27",
        "numSabados": 7957,
        "estado": "<string>"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 2000
