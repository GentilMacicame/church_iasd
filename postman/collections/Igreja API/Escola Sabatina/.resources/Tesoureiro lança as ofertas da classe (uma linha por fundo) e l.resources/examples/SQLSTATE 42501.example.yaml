$kind: http-example
request:
  url: "{{baseUrl}}/v1/escola-sabatina/relatorios-sabado/:id/ofertas"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Idempotency-Key
      value: c966098d-b0d1-9792-7308-91c79fe8dd5f
      disabled: false
      description: UUID gerado no frontend; o mesmo pedido repetido devolve a mesma resposta durante 24 horas
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "3014"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "contaId": 9089,
        "missoes": "650.00",
        "decimoTerceiro": "650.00",
        "despesas": "650.00",
        "contagemId": 1179
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "nao_disponivel",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 4000
