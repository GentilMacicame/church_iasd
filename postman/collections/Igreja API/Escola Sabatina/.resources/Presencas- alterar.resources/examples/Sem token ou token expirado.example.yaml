$kind: http-example
request:
  url: "{{baseUrl}}/v1/escola-sabatina/presencas/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: "2712"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "relatorioId": 6305,
        "membroId": 9909,
        "presente": false,
        "estudouLicao": false,
        "estado": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "erro": "erro_interno",
        "mensagem": "string",
        "pedidoId": "string",
        "campo": "string"
      }
order: 3000
