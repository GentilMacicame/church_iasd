# PostgreSQL 16 local. Lê o .env da raiz (BD_PORTA, BD_ADMIN_UTILIZADOR, BD_ADMIN_SENHA).
#   docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${BD_ADMIN_UTILIZADOR:-postgres}
      POSTGRES_PASSWORD: ${BD_ADMIN_SENHA:?defina BD_ADMIN_SENHA no .env}
      TZ: Africa/Maputo
    ports: ["${BD_PORTA:-5432}:5432"]
    volumes: [dados_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BD_ADMIN_UTILIZADOR:-postgres}"]
      interval: 5s
      retries: 10
volumes:
  dados_pg:
