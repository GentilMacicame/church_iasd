# Configuração da API. Em produção cada valor vem de uma variável de ambiente
# (jwt.segredo -> JWT_SEGREDO, etc.).
#
# Produção (sem perfil): NÃO há segredos por defeito. Sem JWT_SEGREDO e CODIGO_SEGREDO (aleatórios),
# a API não arranca. Também recusa os valores de desenvolvimento abaixo e MENSAGENS_MODO=consola.
# Desenvolvimento: MP_CONFIG_PROFILE=dev activa as linhas %dev.* (valores públicos, só para o PC).

jwt.emissor=igreja-api
jwt.acesso.minutos=15
refresh.dias=30
cookie.seguro=true
# desligado = sem envio (Fase 4 implementa o SMS); consola = escreve a mensagem no log (só dev)
mensagens.modo=desligado
# true quando a API está atrás do Nginx (usa o último endereço de X-Forwarded-For, o que o Nginx acrescenta)
proxy.confiavel=false
# tarefas de manutenção diárias (partições do log, idempotência, sessões, visitantes)
tarefas.activas=true
# cálculos de senha em simultâneo (0 = nº de CPUs); tempo máximo por instrução SQL e por bloqueio
senhas.concorrencia=0
bd.timeout.consulta.segundos=30
bd.timeout.bloqueio.segundos=5
# corpo máximo de um pedido (KB)
pedido.max.kb=2048

%dev.jwt.segredo=desenvolvimento-mudar-este-segredo-com-pelo-menos-32-caracteres
%dev.codigo.segredo=desenvolvimento-mudar-segredo-dos-codigos
%dev.mensagens.modo=consola

# Documentação (Swagger UI em /openapi/ui): mostra o contrato oficial api/openapi.yaml, copiado para
# META-INF/openapi.yaml no build. Em produção, o Nginx não deixa chegar a /openapi nem a /metrics
# (docs/producao/nginx.conf.exemplo).
mp.openapi.scan.disable=true
mp.openapi.servers=http://localhost:9080
