# Valores por defeito para desenvolvimento. Em produção cada um é substituído por uma
# variável de ambiente (jwt.segredo -> JWT_SEGREDO, etc.). Segredos reais NUNCA aqui.
jwt.segredo=desenvolvimento-mudar-este-segredo-com-pelo-menos-32-caracteres
jwt.emissor=igreja-api
jwt.acesso.minutos=15
refresh.dias=30
# false só em desenvolvimento local sem HTTPS
cookie.seguro=true
codigo.segredo=desenvolvimento-mudar-segredo-dos-codigos
# consola = escreve no log a mensagem que seria enviada (só desenvolvimento)
mensagens.modo=consola
# true quando a API está atrás do Nginx (usa X-Forwarded-For)
proxy.confiavel=false
# tarefas de manutenção diárias (partições do log, idempotência, visitantes); false = não correm nesta instância
tarefas.activas=true

# Documentação (Swagger UI em /openapi/ui): mostra o contrato oficial api/openapi.yaml, copiado para
# META-INF/openapi.yaml no build. O ContratoTest garante que o código tem exactamente essas rotas.
mp.openapi.scan.disable=true
mp.openapi.servers=http://localhost:9080
