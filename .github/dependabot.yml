# Auditoria L6: propostas semanais de actualização das dependências (Maven e GitHub Actions),
# incluindo as de segurança. Cada proposta passa pela CI antes de ser aceite.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
